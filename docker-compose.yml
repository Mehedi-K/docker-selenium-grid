# Dockerized Selenium Grid: one hub + Chrome/Firefox nodes on a shared
# network. Point any RemoteWebDriver-based test suite at the hub via
# SELENIUM_REMOTE_URL=http://localhost:4444/wd/hub (or
# http://selenium-hub:4444/wd/hub for a test runner that is itself a
# container on this same compose network).

services:
  selenium-hub:
    image: selenium/hub:4.25.0-20240922
    container_name: selenium-hub
    ports:
      - "4442:4442" # event bus publish
      - "4443:4443" # event bus subscribe
      - "4444:4444" # Grid console / WebDriver endpoint
    environment:
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_SESSION_RETRY_INTERVAL=2
    networks:
      - selenium-grid
    healthcheck:
      test: ["CMD", "/opt/bin/curl", "-sSL", "http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  chrome:
    image: selenium/node-chrome:4.25.0-20240922
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    networks:
      - selenium-grid

  firefox:
    image: selenium/node-firefox:4.25.0-20240922
    shm_size: 2gb
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    networks:
      - selenium-grid

networks:
  selenium-grid:
    driver: bridge
