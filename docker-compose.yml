# Dockerized Selenium Grid: one hub + Chrome/Firefox nodes on a shared
# network. Point any RemoteWebDriver-based test suite at the hub via
# SELENIUM_REMOTE_URL=http://localhost:4444/wd/hub (or
# http://selenium-hub:4444/wd/hub for a test runner that is itself a
# container on this same compose network).
#
# The hub has no container-level healthcheck: the bundled node images
# don't reliably ship a `curl` binary at a fixed path across releases,
# and depends_on/service_healthy would tie node startup to it. Instead,
# nodes start alongside the hub and retry their event-bus registration
# on their own, and callers (including this repo's CI) poll the hub's
# /wd/hub/status endpoint from outside the container before using it.

services:
  selenium-hub:
    image: selenium/hub:4.49.0-20260909
    container_name: selenium-hub
    ports:
      - "4442:4442" # event bus publish
      - "4443:4443" # event bus subscribe
      - "4444:4444" # Grid console / WebDriver endpoint
    environment:
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_SESSION_RETRY_INTERVAL=2
    networks:
      - selenium-grid

  chrome:
    image: selenium/node-chrome:4.49.0-20260909
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    networks:
      - selenium-grid

  firefox:
    image: selenium/node-firefox:4.49.0-20260909
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    networks:
      - selenium-grid

  # Serves smoke-tests/fixtures/ to the browser nodes as http://fixtures/ so
  # timing-sensitive smoke tests don't depend on a third-party site's uptime.
  fixtures:
    image: nginx:1.29-alpine
    volumes:
      - ./smoke-tests/fixtures:/usr/share/nginx/html:ro
    networks:
      - selenium-grid

networks:
  selenium-grid:
    driver: bridge
